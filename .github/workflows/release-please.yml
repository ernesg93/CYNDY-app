name: Release Please
on:
  push:
    branches: [release-preparation]
  workflow_dispatch:
permissions: {}
jobs:
  release:
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' && github.ref == 'refs/heads/release-preparation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Prepare release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: release-preparation
          skip-github-release: false
