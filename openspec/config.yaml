schema: spec-driven

context: |
  Tech stack: React 19, TypeScript 7, Vite 8, and Vitest 5 under app/.
  Architecture: Static React application with pure domain modules; IndexedDB persistence follows in the next work unit.
  Testing: Vitest unit tests and TypeScript type checking are available; integration and E2E layers are not established yet.
  Delivery: Stacked-to-main; keep reviewable work units at or below 400 changed lines.
  Baseline: Empty published repository; do not infer application conventions from it.

strict_tdd: false

testing:
  detected: 2026-10-12
  runner:
    available: true
    command: "cd app && npm test -- --run"
    framework: "Vitest 5"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    available: false
    command: ""
  quality:
    linter: ""
    type_checker: "cd app && npm run typecheck"
    formatter: ""

rules:
  proposal:
    - Include scope boundaries and rollback plan for risky changes.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords.
  design:
    - Document architectural decisions and rationale before implementation.
  tasks:
    - Group tasks by phase and keep each work unit reviewable at or below 400 changed lines.
  apply:
    guidelines:
      - Do not create infrastructure or external resources unless explicitly approved.
      - Establish the stack, quality tooling, and test strategy in an approved bootstrap change.
    tdd: false
    test_command: "cd app && npm test -- --run"
  verify:
    test_command: "cd app && npm test -- --run"
    build_command: "cd app && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
